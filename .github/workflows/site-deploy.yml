name: Site Deployment
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install zensical
      - run: zensical build --clean
      - run: cp -r skills site/

      - name: Compile LLM Docs matching Zensical navigation
        run: |
          python -c '
          import os
          import re
          import shutil
          import tomllib
          
          EXCLUDED_FILES = {
              "ai-assistant.md",
          }

          with open("zensical.toml", "r", encoding="utf-8") as f:
              raw_toml = f.read()

          normalized_toml = re.sub(r"\{\s*\n\s*", "{ ", raw_toml)
          normalized_toml = re.sub(r"\n\s*\}", " }", normalized_toml)

          config = tomllib.loads(normalized_toml)

          skills_dir = os.path.join("site", "skills")
          os.makedirs(skills_dir, exist_ok=True)
          if os.path.exists("skills/SKILL.md"):
              shutil.copy("skills/SKILL.md", os.path.join(skills_dir, "SKILL.md"))
          
          def extract_files(nav_item):
              files = []
              if isinstance(nav_item, str):
                  files.append(nav_item)
              elif isinstance(nav_item, list):
                  for item in nav_item:
                      files.extend(extract_files(item))
              elif isinstance(nav_item, dict):
                  for val in nav_item.values():
                      files.extend(extract_files(val))
              return files
          
          compiled_content = ["# ESN Cyprus Official Documentation (Compiled)\n"]
          for path in extract_files(config.get("project", {}).get("nav", [])):
              if path in EXCLUDED_FILES or os.path.basename(path) in EXCLUDED_FILES:
                  continue
          
              full_path = os.path.join("docs", path)
              if os.path.exists(full_path):
                  compiled_content.append(f"\n\n---\n# FILE: {path}\n---\n\n")
                  with open(full_path, "r", encoding="utf-8") as infile:
                      compiled_content.append(infile.read())

          output_text = "".join(compiled_content)
          with open(os.path.join(skills_dir, "all_docs.md"), "w", encoding="utf-8") as out:
              out.write(output_text)
          '

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment